<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020915"><title>JARVIS v0.3</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#020915;color:#b7edff;font-family:Arial,sans-serif}body{display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at center,#12304c,#020915 72%);overflow:hidden}.hud{position:relative;width:min(86vw,440px);aspect-ratio:1;display:grid;place-items:center;--level:0;filter:drop-shadow(0 0 14px #009dff)}.ring{position:absolute;border-radius:50%;border:2px solid #38caff;box-shadow:0 0 13px #00bfff88,inset 0 0 10px #00bfff55}.r1{inset:2%;border-style:dashed;animation:spin 31s linear infinite}.r2{inset:12%;border:7px double #39d9ff;border-left-color:transparent;animation:spin 19s linear infinite reverse}.r3{inset:23%;border:3px dotted #92faff;animation:spin 12s linear infinite}.r4{inset:32%;border:5px solid #2bbdff;border-top-color:transparent;animation:spin 8s linear infinite reverse}.ticks{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#73e8ffbb 0deg .5deg,transparent .5deg 5deg);mask:radial-gradient(circle,transparent 65%,black 66%,black 68%,transparent 69%);animation:spin 65s linear infinite}.core{width:29%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#e2ffff,#2ccfff 18%,#005fa9 44%,#001329 76%);box-shadow:0 0 calc(22px + var(--level)*60px) #00cfff,0 0 70px #007bff;transform:scale(calc(1 + var(--level)*.42));transition:transform .07s linear,box-shadow .07s linear;animation:breath 4s ease-in-out infinite}.hud.listening .ring{filter:brightness(calc(1 + var(--level)*2))}.ripple{position:absolute;inset:32%;border:2px solid #bfffff;border-radius:50%;opacity:0;pointer-events:none}.hud.pulse .ripple{animation:ripple .8s ease-out}h1{font-size:14px;letter-spacing:.35em;font-weight:400;margin:26px 0 14px}button{background:#06283c;border:1px solid #34cfff;border-radius:24px;color:#c5f7ff;padding:13px 22px;font-size:15px}#status{font-size:12px;min-height:40px;margin:15px 22px;text-align:center;color:#8ac3d5} @keyframes spin{to{transform:rotate(360deg)}}@keyframes breath{50%{filter:brightness(1.35)}}@keyframes ripple{0%{opacity:1;transform:scale(.6)}100%{opacity:0;transform:scale(3)}}@media(prefers-reduced-motion:reduce){.ring,.ticks,.core{animation:none}}
</style></head><body><div class="hud" id="hud" aria-label="音声反応リング"><div class="ticks"></div><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div><div class="core"></div><div class="ripple"></div></div><h1>J A R V I S · 0.3</h1><button id="toggle">マイク反応を開始</button><p id="status" role="status">タップでマイクの使用を許可してください</p><script>
const hud=document.getElementById('hud'),btn=document.getElementById('toggle'),status=document.getElementById('status');let stream,ctx,analyser,buffer,raf;function animate(){analyser.getByteTimeDomainData(buffer);let sum=0;for(let x of buffer){let v=(x-128)/128;sum+=v*v}let rms=Math.sqrt(sum/buffer.length);let level=Math.min(1,Math.max(0,(rms-.012)*9));hud.style.setProperty('--level',level.toFixed(3));raf=requestAnimationFrame(animate)}async function stop(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(ctx)await ctx.close();ctx=null;hud.classList.remove('listening');hud.style.setProperty('--level',0);btn.textContent='マイク反応を開始';status.textContent='停止中'}btn.addEventListener('click',async()=>{if(stream){await stop();return}if(!navigator.mediaDevices?.getUserMedia){status.textContent='この環境ではマイクを利用できません。HTTPSのページで開いてください。';return}try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();analyser=ctx.createAnalyser();analyser.fftSize=1024;buffer=new Uint8Array(analyser.fftSize);ctx.createMediaStreamSource(stream).connect(analyser);hud.classList.add('listening');btn.textContent='マイク反応を停止';status.textContent='マイク入力に反応中（音声の録音・送信はしません）';animate()}catch(e){status.textContent='マイクを開始できませんでした：'+e.name;if(stream)await stop()}});hud.addEventListener('click',()=>{hud.classList.remove('pulse');void hud.offsetWidth;hud.classList.add('pulse')});document.addEventListener('visibilitychange',()=>{if(document.hidden&&stream)status.textContent='バックグラウンドではマイク入力が停止・制限される場合があります'});window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});
</script></body></html>
